name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and install (ubuntu-${{ matrix.ubuntu }}, Qt ${{ matrix.qt }})
    runs-on: &runner-labels [self-hosted, "ubuntu-${{ matrix.ubuntu }}", "qt-${{ matrix.qt }}"]

    strategy: &qt-strategy
      fail-fast: false
      matrix:
        include:
          - ubuntu: "22.04"
            qt: "6.2.3"
          - ubuntu: "22.04"
            qt: "6.8.3"
          - ubuntu: "22.04"
            qt: "6.11.1"
          - ubuntu: "26.04"
            qt: "6.2.3"
          - ubuntu: "26.04"
            qt: "6.8.3"
          - ubuntu: "26.04"
            qt: "6.11.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DMATOMOQT_BUILD_QML=OFF
          -DMATOMOQT_BUILD_TESTS=ON
          -DMATOMOQT_BUILD_EXAMPLES=OFF
          -DMATOMOQT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix "$RUNNER_TEMP/matomoqt-install"

      - name: Configure downstream consumer
        run: >
          cmake -S tests/consumer -B "$RUNNER_TEMP/matomoqt-consumer-build"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/matomoqt-install"

      - name: Build downstream consumer
        run: cmake --build "$RUNNER_TEMP/matomoqt-consumer-build" --parallel

      - name: Run downstream consumer
        run: "$RUNNER_TEMP/matomoqt-consumer-build/matomoqt_consumer"

  coverage:
    name: Code coverage
    runs-on: [self-hosted, "ubuntu-22.04", "qt-6.8.3"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Configure
        run: >
          cmake -S . -B build-coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DMATOMOQT_BUILD_QML=OFF
          -DMATOMOQT_BUILD_TESTS=ON
          -DMATOMOQT_BUILD_EXAMPLES=OFF
          -DMATOMOQT_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build-coverage --parallel

      - name: Test
        run: ctest --test-dir build-coverage --output-on-failure

      - name: Install gcovr
        run: |
          python3 -m venv "$RUNNER_TEMP/gcovr-venv"
          "$RUNNER_TEMP/gcovr-venv/bin/pip" install --quiet gcovr

      - name: Generate coverage report
        run: |
          mkdir -p coverage-html
          "$RUNNER_TEMP/gcovr-venv/bin/gcovr" \
            --root . \
            --filter 'src/' \
            --filter 'include/' \
            --exclude-unreachable-branches \
            --txt-metric line \
            --print-summary \
            --markdown coverage.md \
            --html-details coverage-html/index.html \
            --cobertura coverage.xml \
            build-coverage

      - name: Publish coverage summary
        if: always()
        run: cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage-html
            coverage.xml
          retention-days: 14

  qml:
    name: QML module (ubuntu-${{ matrix.ubuntu }}, Qt ${{ matrix.qt }})
    runs-on: *runner-labels

    strategy: *qt-strategy

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DMATOMOQT_BUILD_QML=ON
          -DMATOMOQT_BUILD_TESTS=ON
          -DMATOMOQT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install QML module
        run: cmake --install build --prefix "$RUNNER_TEMP/matomoqt-install"

      - name: Configure downstream QML consumer
        run: >
          cmake -S tests/consumer -B "$RUNNER_TEMP/matomoqt-qml-consumer-build"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/matomoqt-install"

      - name: Build downstream QML consumer
        run: cmake --build "$RUNNER_TEMP/matomoqt-qml-consumer-build" --parallel

      - name: Run downstream QML consumer
        env:
          QML2_IMPORT_PATH: ${{ runner.temp }}/matomoqt-install/lib/qml
        run: "$RUNNER_TEMP/matomoqt-qml-consumer-build/matomoqt_qml_consumer"
