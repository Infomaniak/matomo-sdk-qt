name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and install (ubuntu-${{ matrix.ubuntu }}, Qt ${{ matrix.qt }})
    runs-on: [self-hosted, "ubuntu-${{ matrix.ubuntu }}", "qt-${{ matrix.qt }}"]

    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: "22.04"
            qt: "6.2.3"
          - ubuntu: "22.04"
            qt: "6.8.3"
          - ubuntu: "22.04"
            qt: "6.11.1"
          - ubuntu: "26.04"
            qt: "6.2.3"
          - ubuntu: "26.04"
            qt: "6.8.3"
          - ubuntu: "26.04"
            qt: "6.11.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DMATOMOQT_BUILD_QML=OFF
          -DMATOMOQT_BUILD_TESTS=ON
          -DMATOMOQT_BUILD_EXAMPLES=OFF
          -DMATOMOQT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix "$RUNNER_TEMP/matomoqt-install"

      - name: Configure downstream consumer
        run: >
          cmake -S tests/consumer -B "$RUNNER_TEMP/matomoqt-consumer-build"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/matomoqt-install"

      - name: Build downstream consumer
        run: cmake --build "$RUNNER_TEMP/matomoqt-consumer-build" --parallel

      - name: Run downstream consumer
        run: "$RUNNER_TEMP/matomoqt-consumer-build/matomoqt_consumer"
